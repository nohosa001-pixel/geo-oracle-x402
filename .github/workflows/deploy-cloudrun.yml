name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Google Cloud Run region"
        required: false
        default: "asia-northeast3"
      service_name:
        description: "Cloud Run service name"
        required: false
        default: "geo-oracle-x402"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name || 'geo-oracle-x402' }}
          region: ${{ inputs.region || 'asia-northeast3' }}
          source: .
          flags: >-
            --allow-unauthenticated
            --set-env-vars=CORS_ALLOW_ORIGINS=*,PREVIEW_RATE_LIMIT_PER_MIN=30

      - name: Run Live Smoke Test
        run: |
          python scripts/smoke_test_live.py --url "${{ steps.deploy.outputs.url }}"
